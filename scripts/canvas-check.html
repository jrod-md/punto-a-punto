<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comprobación local de canvas</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 20px;
        background: #f7f3ec;
        color: #30382f;
      }
      button {
        min-height: 44px;
        padding: 12px;
      }
      canvas {
        display: block;
        width: 360px;
        max-width: 100%;
        height: 420px;
        touch-action: none;
        margin: 20px 0;
      }
      li {
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Comprobación del canvas de 200 × 200</h1>
    <p>
      Eventos de prueba sintéticos en un canvas aislado, sin guardar ni
      modificar proyectos.
    </p>
    <button id="run">Ejecutar comprobaciones</button
    ><canvas id="canvas" tabindex="0"></canvas>
    <ol id="results"></ol>
    <p id="summary" role="status">Listo para ejecutar.</p>
    <script type="module" src="./canvas-check.ts"></script>
  </body>
</html>
